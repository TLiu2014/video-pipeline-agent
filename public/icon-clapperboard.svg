<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CineDAG">
  <defs>
    <linearGradient id="cdBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="cdSheen" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2A63" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cdClap"><rect x="112" y="150" width="288" height="58" rx="14"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#cdBg)"/>
  <rect width="512" height="512" rx="120" fill="url(#cdSheen)"/>

  <!-- Clapperboard -->
  <g filter="url(#cdShadow)">
    <!-- board -->
    <rect x="112" y="214" width="288" height="150" rx="22" fill="#FFFFFF"/>
    <!-- clapper stick (striped top) -->
    <rect x="112" y="150" width="288" height="58" rx="14" fill="#FFFFFF"/>
    <g clip-path="url(#cdClap)" stroke="#4338CA" stroke-width="28">
      <line x1="118" y1="224" x2="172" y2="134"/>
      <line x1="172" y1="224" x2="226" y2="134"/>
      <line x1="226" y1="224" x2="280" y2="134"/>
      <line x1="280" y1="224" x2="334" y2="134"/>
      <line x1="334" y1="224" x2="388" y2="134"/>
      <line x1="388" y1="224" x2="442" y2="134"/>
    </g>
    <!-- slate field lines -->
    <g stroke="#C7D2FE" stroke-width="14" stroke-linecap="round">
      <line x1="150" y1="266" x2="362" y2="266"/>
      <line x1="150" y1="304" x2="362" y2="304"/>
      <line x1="150" y1="342" x2="300" y2="342"/>
    </g>
  </g>
</svg>
