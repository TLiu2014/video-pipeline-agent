      <line x1="108" y1="196" x2="228" y2="238"/>
      <line x1="108" y1="316" x2="228" y2="284"/>
    </g>
    <!-- source nodes -->
    <g fill="#FFFFFF">
      <circle cx="108" cy="196" r="21"/>
      <circle cx="108" cy="316" r="21"/>
    </g>

    <!-- clapperboard (frame) -->
    <rect x="228" y="202" width="214" height="152" rx="24" fill="#FFFFFF"/>
    <rect x="228" y="158" width="214" height="44" rx="12" fill="#FFFFFF"/>
    <g clip-path="url(#cfClap)" stroke="#4338CA" stroke-width="30">
      <line x1="220" y1="214" x2="256" y2="150"/>
      <line x1="264" y1="214" x2="300" y2="150"/>
      <line x1="308" y1="214" x2="344" y2="150"/>
      <line x1="352" y1="214" x2="388" y2="150"/>
      <line x1="396" y1="214" x2="432" y2="150"/>
      <line x1="440" y1="214" x2="476" y2="150"/>
    </g>

    <!-- AI sparkles on the slate -->
    <g fill="#4338CA">
      <path d="M328 230 L337.2 262.8 L370 272 L337.2 281.2 L328 314 L318.8 281.2 L286 272 L318.8 262.8 Z"/>
      <path d="M392 216 L395.5 228.5 L408 232 L395.5 235.5 L392 248 L388.5 235.5 L376 232 L388.5 228.5 Z"/>
