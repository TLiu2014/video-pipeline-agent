<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CineDAG">
  <defs>
    <linearGradient id="cfBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="cfSheen" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2A63" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cfClap"><rect x="228" y="158" width="214" height="44" rx="12"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#cfBg)"/>
  <rect width="512" height="512" rx="120" fill="url(#cfSheen)"/>

  <g filter="url(#cfShadow)">
    <!-- flow edges: two nodes → clapperboard (straight) -->
